webdriver {
  driver = appium
  autodownload = false
}

appium {
  # Appium 2 / Selenium 4 exigen el prefijo de vendor "appium:" en toda capability
  # que no sea del estandar W3C. Serenity lo agrega automaticamente solo si se
  # habilita el procesamiento y se declaran las claves en additional.capabilities.
  # Las claves no declaradas (como "hub") se descartan en lugar de romper la sesion.
  process.desired.capabilities = true
  additional.capabilities = "app,appPackage,appActivity,automationName,deviceName,autoGrantPermissions,newCommandTimeout,uiautomator2ServerInstallTimeout,adbExecTimeout"

  hub = "http://127.0.0.1:4723"
  platformName = "Android"
  app = ${user.dir}"/apps/ApiDemos-debug.apk"
  automationName = "UiAutomator2"
  deviceName = "emulator-5554"
  autoGrantPermissions = true
  newCommandTimeout = 300
  appPackage = "io.appium.android.apis"
  appActivity = ".ApiDemos"
  uiautomator2ServerInstallTimeout = 120000
  adbExecTimeout = 60000
}

serenity {
  project.name = "Automatizacion Mobile - ApiDemos"
  take.screenshots = FOR_EACH_ACTION
  report.show.step.details = true
  report.encoding = "UTF-8"
  timeout = 20000
}
